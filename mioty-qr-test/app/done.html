<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Successfully connected — Mioty</title>
  <!-- Installable: „Add to Home Screen" opens it full-screen, no browser bar -->
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mioty test" />
  <link rel="apple-touch-icon" href="../icon-180.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="../lib/tailwind.css" />
  <link rel="stylesheet" href="../lib/shadcn.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="stage">
    <div class="device-viewport" id="device">
      <div class="device-inner">
        <div class="device-pane">
          <main class="screen" id="screen">

            <div class="onb center">
              <span class="ph"></span>
              <h1 class="h1">Successfully connected</h1>
              <span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
              <p class="lead"><strong id="n"></strong> Mioty devices have been successfully added to your organization. You can now access and manage them in “<span id="ws"></span>”.</p>
              <div class="onb__grow"></div>
              <div class="onb__foot">
                <a class="btn btn--primary btn--block" href="index.html" id="go">Run the flow again</a>
                <a class="btn btn--ghost btn--block" href="../index.html">Back to start page</a>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>

<script src="../lib/icons.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/components.js"></script>
<script src="mioty.js"></script>
<script>
  AppShell.mount({ app: 'mioty', title: '', back: null, backLabel: 'Back', tabs: [] });
  Mioty.done();</script>
</body>
</html>
