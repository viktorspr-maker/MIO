<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Add Mioty device/-s — Mioty</title>
  <!-- Installable: „Add to Home Screen" opens it full-screen, no browser bar -->
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mioty test" />
  <link rel="apple-touch-icon" href="../icon-180.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="../lib/tailwind.css" />
  <link rel="stylesheet" href="../lib/shadcn.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="stage">
    <div class="device-viewport" id="device">
      <div class="device-inner">
        <div class="device-pane">
          <main class="screen" id="screen">

            <div class="onb">
              <span class="ph"></span>
              <h1 class="h1">Add Mioty device/-s</h1>
              <p class="lead">Pick how to register the devices in <strong id="wsName"></strong>. All three end with the same list.</p>
              <div class="stack">
                <a class="btn btn--outline btn--block" href="kit.html">I have a KIT</a>
                <a class="btn btn--outline btn--block" href="scan.html">Scan QR code</a>
                <a class="btn btn--outline btn--block" href="csv.html">Upload .csv file</a>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>

<script src="../lib/icons.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/components.js"></script>
<script src="mioty.js"></script>
<script>
  AppShell.mount({ app: 'mioty', title: '', back: "workspace.html", backLabel: 'Back', tabs: [] });
  document.getElementById('wsName').textContent = Mioty.state.workspace;</script>
</body>
</html>
