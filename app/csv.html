<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Upload .csv file — Mioty</title>
  <!-- Installable: „Add to Home Screen" opens it full-screen, no browser bar -->
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mioty test" />
  <link rel="apple-touch-icon" href="../icon-180.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="../lib/tailwind.css" />
  <link rel="stylesheet" href="../lib/shadcn.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="stage">
    <div class="device-viewport" id="device">
      <div class="device-inner">
        <div class="device-pane">
          <main class="screen" id="screen">

            <div class="onb">
              <h1 class="h1" style="font-size: var(--text-xl)">Downloads</h1>
              <p class="hint">Pick the device list — from the stand-in below, or a real file on this phone (the QR sheet has one).</p>
              <div class="files" id="files" role="listbox" aria-label="Files"></div>
              <button class="btn btn--outline btn--block" type="button" id="pick">Choose a .csv from this phone</button>
              <input type="file" id="file" accept=".csv,text/csv" hidden />
              <p class="hint" id="picked" hidden></p>
              <div class="onb__grow"></div>
              <div class="onb__foot">
                <button class="btn btn--primary btn--block" id="go" type="button" disabled>Add</button>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>

<script src="../lib/icons.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/components.js"></script>
<script src="mioty.js"></script>
<script>
  AppShell.mount({ app: 'mioty', title: '', back: "add.html", backLabel: 'Back', tabs: [] });
  Mioty.filePicker();</script>
</body>
</html>
