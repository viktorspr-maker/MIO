<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Choose workspace — Mioty</title>
  <!-- Installable: „Add to Home Screen" opens it full-screen, no browser bar -->
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mioty test" />
  <link rel="apple-touch-icon" href="../icon-180.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="../lib/tailwind.css" />
  <link rel="stylesheet" href="../lib/shadcn.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="stage">
    <div class="device-viewport" id="device">
      <div class="device-inner">
        <div class="device-pane">
          <main class="screen" id="screen">

            <div class="onb">
              <span class="ph"></span>
              <h1 class="h1">Choose workspace</h1>
              <p class="lead">You have access to multiple workspaces. To switch, tap “Change workspace” or the workspace name below.</p>
              <button class="opt" type="button" id="wsBtn" aria-haspopup="listbox" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
                <span class="opt__text"><span class="opt__label">Your current workspace is:</span><span class="opt__value" id="wsName"></span></span>
                <svg class="opt__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <div class="stack stack--tight" id="wsList" hidden role="listbox" aria-label="Workspaces"></div>
              <a class="link" href="#" id="wsChange">Change workspace</a>
              <div class="onb__grow"></div>
              <div class="onb__foot">
                <a class="btn btn--primary btn--block" href="add.html">Continue</a>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>

<script src="../lib/icons.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/components.js"></script>
<script src="mioty.js"></script>
<script>
  AppShell.mount({ app: 'mioty', title: '', back: "login.html", backLabel: 'Back', tabs: [] });
  Mioty.workspacePicker();</script>
</body>
</html>
