<!DOCTYPE html>
<html lang="en">
<head>

  <title>Scan QR code — Mioty</title>
  <!-- Installable: „Add to Home Screen" opens it full-screen, no browser bar -->
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="stylesheet" href="../lib/shadcn.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* the scanner owns the whole screen: no padding, camera fills */
    .screen--flush { display: flex; flex-direction: column; }

</head>

                  <span class="cam__line"></span>
                </button>
              </div>
              <div class="cam__foot">
                <div class="cam__row">
                  <button class="btn btn--outline" type="button" id="enter" style="flex:1">Enter code</button>
                  <button class="btn btn--outline btn--icon" type="button" id="undo" data-tooltip="Remove last scanned" aria-label="Remove last scanned" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                </div>
                <p class="cam__status" id="status" aria-live="polite">Point the camera at a device QR. Tap the frame to fake one.</p>
                <button class="btn btn--primary btn--block" id="go" type="button" disabled>Add</button>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

<script src="../lib/icons.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/components.js"></script>
<script src="../vendor/jsqr.js"></script>
<script src="mioty.js"></script>
<script>
  /* The scanner has its own ✕ — no app bar on top of the camera. */
  AppShell.mount({ app: 'mioty', title: '', back: null, tabs: [] });
  Mioty.scanner();</script>
